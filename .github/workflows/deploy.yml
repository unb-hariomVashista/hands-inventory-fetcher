name: Build and Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install All Dependencies (including dev)
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build Production Assets
        run: npm run build

      - name: Deploy Built Artifacts to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          source: "build,public,prisma,package.json,package-lock.json,ecosystem.config.cjs"
          target: "/mnt/app_extend_storage/apps/handsinventorysync"
          overwrite: true

      - name: Install Production Deps & Restart PM2 on VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            cd /mnt/app_extend_storage/apps/handsinventorysync
            npm ci --omit=dev --ignore-engines
            npx prisma db push
            pm2 restart ecosystem.config.cjs || pm2 start ecosystem.config.cjs
